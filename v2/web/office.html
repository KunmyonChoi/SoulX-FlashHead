<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 비서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --desk: #EEF2F5; --paper: #FBFCFD; --sunk: #F3F6F8; --ink: #17212B; --muted: #5B6773; --faint: #8A95A0;
  --rule: #DCE3E9; --rule-strong: #C5CFD8;
  --focus: #0B7A75; --focus-soft: #E3F2F1; --focus-ink: #075A56;
  --amber: #B7791F; --amber-soft: #FBF1DF; --rust: #B4441C; --rust-soft: #FBE9E2; --green: #2F7D4F; --green-soft: #E4F2EA;
  --shadow: 0 1px 2px rgba(23, 33, 43, .06), 0 8px 24px rgba(23, 33, 43, .06);
  --radius: 10px; --radius-sm: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F151B; --paper: #161E26; --sunk: #1B252E; --ink: #E6ECF1; --muted: #9AA7B3; --faint: #6E7B87;
    --rule: #26323D; --rule-strong: #33414E;
    --focus: #3FB8B0; --focus-soft: #12302F; --focus-ink: #7AD9D2;
    --amber: #E0A84A; --amber-soft: #2E2414; --rust: #E2774F; --rust-soft: #33201A; --green: #5DBB84; --green-soft: #15291E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F151B; --paper: #161E26; --sunk: #1B252E; --ink: #E6ECF1; --muted: #9AA7B3; --faint: #6E7B87;
  --rule: #26323D; --rule-strong: #33414E;
  --focus: #3FB8B0; --focus-soft: #12302F; --focus-ink: #7AD9D2;
  --amber: #E0A84A; --amber-soft: #2E2414; --rust: #E2774F; --rust-soft: #33201A; --green: #5DBB84; --green-soft: #15291E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--ink); font: 15px/1.5 "Pretendard Variable", Pretendard, system-ui, sans-serif;
       font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- frame ------------------------------------------------------------------------------ */
.app { display: grid; grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100vh; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--paper);
       border-bottom: 1px solid var(--rule); }
.top h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top .who { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px;
        background: var(--sunk); color: var(--muted); border: 1px solid var(--rule); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.listening .dot { background: var(--focus); box-shadow: 0 0 0 4px var(--focus-soft); }
.pill.keep { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.btn { border: 1px solid var(--rule-strong); background: var(--paper); border-radius: var(--radius-sm); padding: 7px 14px; font-weight: 600; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, var(--rule)); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 7px 10px; }
.btn.quiet:hover { color: var(--ink); background: var(--sunk); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---- conversation rail --------------------------------------------------------------------- */
.rail { display: flex; flex-direction: column; background: var(--paper); border-right: 1px solid var(--rule); min-height: 0; }
.face { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.face .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(140deg, var(--focus-soft), var(--sunk));
                display: grid; place-items: center; color: var(--focus-ink); font-weight: 700; }
.face .state { font-size: 13px; color: var(--muted); }
.log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.turn { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 14.5px; }
.turn.agent { background: var(--sunk); align-self: flex-start; border-top-left-radius: 4px; }
.turn.user { background: var(--focus-soft); color: var(--focus-ink); align-self: flex-end; border-top-right-radius: 4px; }
.turn.user.unsure { background: var(--amber-soft); color: var(--ink); }
.turn .heard { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.turn .fix { border: 0; background: none; color: var(--focus-ink); padding: 0; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
.choice { border: 1px solid var(--focus); color: var(--focus-ink); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.choice:hover { background: var(--focus-soft); }
.say { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rule); }
.say input { flex: 1; min-width: 0; border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); padding: 8px 10px; background: var(--paper); }
.mic { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--focus); color: #fff; display: grid; place-items: center; }

/* ---- workspace ------------------------------------------------------------------------------ */
.work { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; position: relative; }
.work.with-side { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); }
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 16px 20px 0; gap: 12px; }
.caption { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-radius: var(--radius); background: var(--paper);
           border: 1px solid var(--rule); border-left: 3px solid var(--focus); box-shadow: var(--shadow); }
.caption b { color: var(--focus-ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
.caption span { font-size: 15px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); }
.tab { border: 0; background: none; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; color: var(--muted); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filter .n { font-weight: 700; margin-left: 4px; }
.sheet { flex: 1; min-height: 0; overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius) var(--radius) 0 0; }
table { width: 100%; border-collapse: collapse; }
thead th { position: sticky; top: 0; background: var(--paper); text-align: left; font-size: 12.5px; font-weight: 600; color: var(--faint);
           padding: 9px 10px; border-bottom: 1px solid var(--rule); z-index: 1; }
tbody tr { border-bottom: 1px solid var(--rule); cursor: pointer; }
tbody tr:hover { background: var(--sunk); }
tbody tr.unread .from, tbody tr.unread .subject { font-weight: 650; }
tbody tr.read { color: var(--muted); }
tbody tr.focus { background: var(--focus-soft); box-shadow: inset 3px 0 0 var(--focus); }
tbody tr.open { background: var(--sunk); box-shadow: inset 3px 0 0 var(--ink); }
tbody tr.gone { opacity: .35; text-decoration: line-through; }
td { padding: 10px; vertical-align: top; font-size: 14.5px; }
td.num { width: 34px; color: var(--faint); font-size: 13px; text-align: right; }
td.pick { width: 30px; }
td.from { width: 22%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
td .preview { display: block; color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
td.when { width: 92px; white-space: nowrap; color: var(--muted); font-size: 13px; text-align: right; }
.mark { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.mark.reply { color: var(--amber); background: var(--amber-soft); }
.mark.risk { color: var(--rust); background: var(--rust-soft); }
.mark.ad { color: var(--muted); background: var(--sunk); border: 1px solid var(--rule); }
.mark.clip { color: var(--muted); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--focus); }
.selbar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--ink); color: var(--paper);
          border-radius: var(--radius) var(--radius) 0 0; }
.selbar .count { font-weight: 700; margin-right: 8px; }
.selbar .btn { background: transparent; color: var(--paper); border-color: rgba(255,255,255,.25); }
.selbar .btn:hover { background: rgba(255,255,255,.08); }
.selbar .spacer { flex: 1; }

/* ---- side panel: reader, compose, plan, report ------------------------------------------------ */
.side { background: var(--paper); border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.side header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.side header h2 { font-size: 15px; margin: 0; flex: 1; }
.side .body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.side footer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--rule); background: var(--paper); }
.side footer .spacer { flex: 1; }
.meta { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 13.5px; margin-bottom: 14px; }
.meta dt { color: var(--faint); }
.meta dd { margin: 0; }
.letter { white-space: pre-wrap; font-size: 15px; line-height: 1.7; }
.warn { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--rust-soft); color: var(--rust); font-size: 13.5px; margin-bottom: 14px; }
.file { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border: 1px solid var(--rule); border-radius: var(--radius-sm); font-size: 13px; margin-top: 14px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12.5px; color: var(--faint); }
.field input, .field textarea { border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); padding: 8px 10px; background: var(--paper); }
.field textarea { min-height: 180px; resize: vertical; line-height: 1.65; }
.hint { font-size: 12.5px; color: var(--muted); }
.plan-group { margin-bottom: 16px; }
.plan-group h3 { font-size: 13.5px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.plan-group h3 .what { color: var(--muted); font-weight: 500; }
.plan-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.plan-item .sub { color: var(--muted); font-size: 12.5px; display: block; }
.report-head { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: var(--radius-sm); background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 14px; }
.undone { color: var(--muted); text-decoration: line-through; }

/* ---- calendar ----------------------------------------------------------------------------- */
.day { display: grid; grid-template-columns: 56px 1fr; }
.hour { height: 52px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--faint); padding: 2px 8px 0 0; text-align: right; }
.lane { position: relative; border-left: 1px solid var(--rule); }
.lane .slot { position: absolute; left: 8px; right: 8px; border-radius: var(--radius-sm); padding: 4px 8px; font-size: 13px; }
.lane .event { background: var(--sunk); border: 1px solid var(--rule-strong); }
.lane .free { border: 1.5px dashed var(--focus); color: var(--focus-ink); background: transparent; text-align: left; }
.lane .free:hover { background: var(--focus-soft); }

/* ---- toast -------------------------------------------------------------------------------- */
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
         padding: 10px 14px 10px 18px; background: var(--ink); color: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20; }
.toast .btn { background: transparent; color: var(--paper); border-color: rgba(255,255,255,.3); }
.toast .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--focus); border-radius: 0 0 0 var(--radius); }

/* ---- phone -------------------------------------------------------------------------------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
  .top { padding: 10px 16px; gap: 10px; }
  .top .who, #theme { display: none; }
  .top .btn { padding: 6px 10px; }
  table { table-layout: fixed; }
  td.pick, thead th:nth-child(2) { width: 34px; }
  td.from, thead th:nth-child(3) { width: 26%; }
  td.when, thead th:nth-child(5) { width: 64px; font-size: 12px; }
  td.subject { overflow: hidden; }
  .rail { grid-row: 3; border-right: 0; border-top: 1px solid var(--rule); max-height: 38vh; }
  .face { display: none; }
  .main { padding: 12px 16px 0; }
  .work.with-side { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 56px 0 0 0; z-index: 10; border-left: 0; }
  td.from { max-width: none; }
  td .preview { max-width: none; }
  td.num, thead th.num { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  tbody tr.focus { transition: background .25s; }
  .toast .bar { transition: width linear; }
}
/* ---- live page additions ---- */
.top select { border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); padding: 5px 8px; background: var(--paper); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg label { padding: 5px 12px; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--ink); font-weight: 650; }
.seg label:has(input:checked) { background: var(--sunk); }
.pill.speaking .dot { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
.pill.off .dot { background: var(--faint); box-shadow: none; }
.keepbox { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.empty { padding: 32px 20px; color: var(--muted); text-align: center; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); background: var(--paper); }
.busy { font-size: 12.5px; color: var(--muted); }
.turn.filler { background: transparent; color: var(--muted); font-size: 13px; padding: 2px 4px; }
.turn.error { background: var(--rust-soft); color: var(--rust); }
.turn.links { align-self: flex-start; display: flex; flex-direction: column; gap: 3px; padding: 6px 12px; border: 1px solid var(--line, rgba(127,127,127,.25)); background: transparent; font-size: 13.5px; }
.turn.links .links-title { font-size: 12px; color: var(--muted); }
.turn.links a { color: var(--focus-ink); text-underline-offset: 2px; overflow-wrap: anywhere; }
.video { margin: 0 16px 10px; border-radius: 14px; overflow: hidden; background: var(--sunk); aspect-ratio: 1; max-height: 38vh; align-self: center; width: calc(100% - 32px); max-width: 38vh; }
.video canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>업무 비서</h1><span class="who" id="who">내 Gmail · 캘린더</span>
    <span class="pill off" id="listen"><span class="dot"></span><span id="listen-text">대화 전</span></span>
    <span class="pill keep" id="keep-pill" hidden>이 대화는 내용까지 기록 중</span>
    <span class="spacer"></span>
    <span class="busy" id="busy" role="status"></span>
    <div class="seg" role="radiogroup" aria-label="채널">
      <label><input type="radio" name="channel" value="text" checked><span>글</span></label>
      <label><input type="radio" name="channel" value="voice"><span>음성</span></label>
      <label><input type="radio" name="channel" value="avatar"><span>아바타</span></label>
    </div>
    <label class="keepbox" title="이 대화 하나만 내용까지 기록합니다(개인정보는 가려서). 무엇이 잘못됐는지 모니터에서 볼 때 켜세요."><input type="checkbox" id="keep"> 내용까지 기록</label>
    <button class="btn quiet" id="theme" title="밝게/어둡게">화면 밝기</button>
    <button class="btn primary" id="toggle">대화 시작</button>
  </header>

  <aside class="rail" aria-label="대화">
    <div class="face"><div class="avatar" aria-hidden="true">비서</div>
      <div><div style="font-weight:600">업무 비서</div><div class="state" id="agent-state">대화 시작을 누르세요</div></div></div>
    <div class="video" id="video" hidden><canvas id="canvas" width="512" height="512" aria-label="비서 아바타"></canvas></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
    <form class="say" id="say"><label class="sr" for="text">비서에게 할 말</label>
      <input id="text" placeholder="말하거나 입력하세요" autocomplete="off" disabled>
      <button class="mic" type="submit" title="보내기" aria-label="보내기">↑</button></form>
  </aside>

  <section class="work" id="work">
    <div class="main">
      <div class="caption" id="caption"><b>비서</b><span id="caption-text">대화를 시작하면 읽지 않은 메일을 띄워 드려요.</span></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="mail">메일</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="cal">일정</button>
      </div>
      <div id="mail-view"><div class="filters" id="filters"></div></div>
      <div class="sheet" id="sheet"><div class="empty"><b>아직 화면에 띄운 것이 없습니다</b>"대화 시작"을 누르세요.</div></div>
    </div>
    <aside class="side" id="side" hidden></aside>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// The office assistant's own screen. It talks to the voice-agent server like the conversation page: the customer's
// words (typed or spoken) and touches go in as {"type": "chat"} and {"type": "action"}; the assistant's words, tool
// events and screens ({"type": "display", kind, data}) come back. Tapping a button never decides anything on its
// own: it sends an action the agent definition lists (office-assistant v4, actions), and the gateway decides.
const $ = id => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) n[k] = v; else if (k === 'class') n.className = v; else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : String(kid));
  return n;
};
const params = new URLSearchParams(location.search);
const AGENT = params.get('agent') || 'office-assistant';
const VERSION = params.get('version') || '';
const SR = 16000, PACKET = 1600;
const FILTER_LABEL = { unread: '읽지 않음', reply: '답장 필요', ads: '광고·알림', all: '전체' };
const MARK_LABEL = { risk: ['의심', 'risk'], reply: ['답장 필요', 'reply'], ad: ['광고', 'ad'], notice: ['알림', 'ad'] };
const ACTION_LABEL = { read: '읽음으로', unread: '안 읽음으로', archive: '보관', spam: '스팸', trash: '휴지통' };

const S = { tab: 'mail', listing: null, calendar: null, picked: new Set(), open: null, focus: null,
            sideKind: null, log: [], turns: {}, running: false, ws: null, cfg: null, channel: 'text' };

// ---- time ----------------------------------------------------------------------------------
const when = iso => { const d = new Date(iso), m = (Date.now() - d) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + '분 전';
  if (m < 1440) return (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() % 12) || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
const hhmm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const isoDate = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ---- talking to the server -------------------------------------------------------------------
let chatId = 0;
function sendChat(text) {
  if (!S.ws || S.ws.readyState !== WebSocket.OPEN || !text.trim()) return;
  const id = 'c' + (++chatId);
  S.ws.send(JSON.stringify({ type: 'chat', id, text }));
  addTurn('user', text, { id });
  busy('비서가 생각하는 중…');
}
function act(name, args) {
  if (!S.ws || S.ws.readyState !== WebSocket.OPEN) { toast('대화가 연결되어 있지 않습니다. "대화 시작"을 누르세요.'); return; }
  S.ws.send(JSON.stringify({ type: 'action', name, arguments: args || {} }));
  busy('처리하는 중…');
}
function busy(text) { $('busy').textContent = text || ''; }

// ---- conversation rail -----------------------------------------------------------------------
function addTurn(role, text, extra = {}) { const t = { role, text, ...extra }; S.log.push(t); if (extra.id) S.turns[extra.id] = t; renderLog(); return t; }
function renderLog() {
  $('log').replaceChildren(...S.log.map(t => t.links
    ? h('div', { class: 'turn links' }, h('span', { class: 'links-title' }, t.text),
        ...t.links.map(l => h('a', { href: l.url, target: '_blank', rel: 'noopener noreferrer' }, l.label)))
    : h('div', { class: 'turn ' + t.role + (t.unsure ? ' unsure' : '') }, t.text,
    t.heard ? h('span', { class: 'heard' }, '이렇게 들었어요. ', h('button', { class: 'fix', onclick: () => fixTurn(t) }, '고치기')) : null)));
  $('log').scrollTop = $('log').scrollHeight;
}
function caption(text) { if (text) $('caption-text').textContent = text; }
function choices(list) {
  $('choices').replaceChildren(...list.map(c => h('button', { class: 'choice', onclick: () => { $('choices').replaceChildren(); c.do(); } }, c.label)));
}
// "오전과 오후 중", "오전이나 오후" in the assistant's question: offer the options as buttons
function optionsIn(text) {
  const m = text.match(/([가-힣A-Za-z0-9 ]{1,12}?)(?:과|와|이나|나|,)\s?([가-힣A-Za-z0-9 ]{1,12}?)\s?(?:중|가운데)/);
  return m ? [m[1].trim().split(' ').pop(), m[2].trim()].filter(Boolean) : [];
}
function fixTurn(t) {
  const input = h('input', { value: t.text, style: 'width:100%' });
  side('fix', '들은 말 고치기', [h('p', { class: 'hint', style: 'margin-top:0' }, '음성 인식이 잘못 들었으면 고쳐서 다시 물어보세요.'), input],
    [h('button', { class: 'btn primary', onclick: () => { closeSide(); sendChat(input.value); } }, '이 말로 다시 묻기'), h('button', { class: 'btn', onclick: closeSide }, '취소')]);
}

// ---- mail list ---------------------------------------------------------------------------------

      h('td', { class: 'pick', onclick: e => e.stopPropagation() }, h('input', { type: 'checkbox', 'aria-label': r.ref + '번 고르기', checked: S.picked.has(r.ref),

      h('td', { class: 'from', title: r.address }, r.from),
      h('td', { class: 'subject' }, r.marks.filter(k => MARK_LABEL[k]).map(k => h('span', { class: 'mark ' + MARK_LABEL[k][1] }, MARK_LABEL[k][0])),
        r.subject, r.attachment ? h('span', { class: 'mark clip', title: r.attachment }, ' · 첨부') : null, h('span', { class: 'preview' }, r.preview)),
      h('td', { class: 'when' }, when(r.at))))));
  const nodes = [table];
  if (S.listing.page > 1 || S.listing.more) nodes.push(h('div', { class: 'pager' },

function planCleanup(kind, refs) {

}

// the editable card: what the 보내기 button sends is exactly what is on it (the action is the consent)
function compose(c) {
  const to = h('input', { value: c.to || '' }), subject = h('input', { value: c.subject || '' }), body = h('textarea', {}, c.body || '');
  side('compose', '보낼 메일', [h('div', { class: 'field' }, h('label', {}, '받는 사람'), to), h('div', { class: 'field' }, h('label', {}, '제목'), subject),
    h('div', { class: 'field' }, h('label', {}, '내용 (고칠 수 있어요)'), body),
    h('p', { class: 'hint' }, '보내기를 누르면 이 내용 그대로 보냅니다. 보낸 뒤 10초 안에는 취소할 수 있어요.')],
    [h('button', { class: 'btn primary', onclick: () => {
        if (!body.value.trim()) { toast('내용을 써 주세요.'); return; }
        const args = c.reply_to ? { reply_to: c.reply_to, subject: subject.value, body: body.value } : { to: to.value, subject: subject.value, body: body.value };
        closeSide(); act('send', args); } }, '보내기'),
     h('button', { class: 'btn', onclick: closeSide }, '취소'), h('span', { class: 'spacer' }),
     h('button', { class: 'btn quiet', onclick: () => { closeSide(); act('save_draft', c.reply_to ? { reply_to: c.reply_to, subject: subject.value, body: body.value }
        : { to: to.value, subject: subject.value, body: body.value }); } }, '초안으로 저장')]);
  setTimeout(() => body.focus(), 50);
}

function planCard(card) {
  const keep = new Map(card.plan.map(g => [g.action, new Set(g.items.map(i => i.ref))]));
  side('plan', '이렇게 정리할게요', [h('p', { class: 'hint', style: 'margin-top:0' }, '빼고 싶은 메일은 체크를 지우세요. 모두 나중에 되돌릴 수 있어요.'),
    ...card.plan.map(g => h('div', { class: 'plan-group' }, h('h3', {}, g.label, h('span', { class: 'what' }, g.items.length + '통')),
      g.items.map(i => h('label', { class: 'plan-item' }, h('input', { type: 'checkbox', checked: true,
        onchange: e => e.target.checked ? keep.get(g.action).add(i.ref) : keep.get(g.action).delete(i.ref) }),
        h('span', {}, i.subject, h('span', { class: 'sub' }, i.from + ' · ' + when(i.at)))))))],
    [h('button', { class: 'btn primary', onclick: () => {
        const args = {}; for (const [a, refs] of keep) if (refs.size) args[a] = [...refs].join(',');
        if (!Object.keys(args).length) { closeSide(); return; }
        closeSide(); act('confirm_cleanup', args); } }, '이대로 정리'), h('button', { class: 'btn', onclick: () => { closeSide(); sendChat('아니, 정리하지 마'); } }, '취소')]);
  choices([{ label: '응, 정리해', do: () => $('side').querySelector('footer .btn.primary').click() }, { label: '취소', do: () => { closeSide(); sendChat('아니, 정리하지 마'); } }]);
}

// ---- calendar -----------------------------------------------------------------------------------
function renderCal() {
  const c = S.calendar;
  if (!c) { $('sheet').replaceChildren(h('div', { class: 'empty' }, h('b', {}, '일정을 아직 띄우지 않았습니다'), '"내일 일정 보여 줘"라고 말해 보세요.',
    h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: () => { const d = new Date(); act('show_day', { date: isoDate(d) }); } }, '오늘'),
      ' ', h('button', { class: 'btn', onclick: () => { const d = new Date(Date.now() + 864e5); act('show_day', { date: isoDate(d) }); } }, '내일')))); return; }
  const start = 8, end = 20, px = 48, hour = iso => { const d = new Date(iso); return d.getHours() + d.getMinutes() / 60; };
  const clamp = v => Math.max(start, Math.min(end, v));
  const day = new Date(c.date + 'T00:00:00');
  const shift = n => { const d = new Date(day.getTime() + n * 864e5); act('show_day', { date: isoDate(d) }); };
  const lane = h('div', { class: 'lane', style: 'height:' + (end - start) * px + 'px' },
    c.events.filter(e => !e.all_day).map(e => { const a = clamp(hour(e.start)), b = clamp(hour(e.end)); if (b <= a) return null;
      return h('div', { class: 'slot event', style: `top:${(a - start) * px + 2}px;height:${Math.max(18, (b - a) * px - 4)}px`, title: e.title },
        hhmm(e.start) + ' ' + e.title + (e.location ? ' · ' + e.location : '')); }),
    c.free.map(f => { const a = clamp(hour(f.start)), b = clamp(hour(f.end)); if (b - a < 0.25) return null;
      return h('button', { class: 'slot free', style: `top:${(a - start) * px + 2}px;height:${(b - a) * px - 4}px`,
        onclick: () => eventCard({ title: '', start: f.start, duration_min: c.duration_min || 30 }) }, hhmm(f.start) + '–' + hhmm(f.end) + ' 비어 있음 · 눌러서 일정 잡기'); }));
  $('sheet').replaceChildren(h('div', { style: 'display:flex;gap:8px;align-items:center;padding:10px 14px' },
      h('button', { class: 'btn quiet', onclick: () => shift(-1), 'aria-label': '전날' }, '‹'), h('b', {}, c.label), h('button', { class: 'btn quiet', onclick: () => shift(1), 'aria-label': '다음 날' }, '›'),
      h('span', { class: 'hint' }, c.events.length + '건' + (c.free.length ? ' · 빈 시간 ' + c.free.length + '곳' : ''))),
    ...c.events.filter(e => e.all_day).map(e => h('div', { class: 'slot event', style: 'position:static;margin:0 14px 6px 70px' }, '종일 · ' + e.title)),
    h('div', { class: 'day' }, h('div', {}, Array.from({ length: end - start }, (_, i) => h('div', { class: 'hour', style: 'height:' + px + 'px' }, (start + i) + ':00'))), lane));
}

// ---- toast ---------------------------------------------------------------------------------
let toastTimer, sendTimer;
function toast(text, action, onAction, seconds = 5) {
  clearTimeout(toastTimer); const bar = h('div', { class: 'bar', style: 'width:100%' });
  $('toast').replaceChildren(h('span', {}, text), action ? h('button', { class: 'btn', onclick: onAction }, action) : null, bar);
  $('toast').hidden = false; requestAnimationFrame(() => { bar.style.transitionDuration = seconds + 's'; bar.style.width = '0%'; });
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, seconds * 1000);
}
function pending(p) {
  clearInterval(sendTimer);
  if (p.state === 'waiting') {
    const left = Math.max(1, Math.round(p.send_at - Date.now() / 1000));
    toast(p.to + '에게 "' + p.subject + '" 보내는 중', '보내기 취소', () => act('cancel_send', { send_id: p.send_id }), left);
    sendTimer = setTimeout(() => toast('보냈어요: ' + p.to + '에게 "' + p.subject + '"'), left * 1000);
  } else if (p.state === 'cancelled') { clearTimeout(sendTimer); toast('보내지 않았어요. 임시보관함에 남겨 두었어요.'); }
}

// ---- what the server sends ------------------------------------------------------------------------
function onDisplay(m) {
  const d = m.data || {};
  if (m.kind === 'mail_list') { S.listing = d; S.tab = 'mail'; S.picked.clear(); if (S.sideKind === 'mail') closeSide(); render(); }
  else if (m.kind === 'mail') showMail(d);
  else if (m.kind === 'calendar') { S.calendar = d; S.tab = 'cal'; render(); }
  else if (m.kind === 'cleanup_report') { S.picked.clear(); reportCard(d); }
  else if (m.kind === 'send_pending') pending(d);
  else if (m.kind === 'confirm') {
    if (d.tool === 'cleanup_mail' && d.plan) planCard(d);
    else if ((d.tool === 'send_mail') && d.compose) { compose(d.compose); choices([{ label: '응, 보내', do: () => sendChat('응, 보내') }, { label: '아니', do: () => { closeSide(); sendChat('아니, 보내지 마'); } }]); }
    else if (d.tool === 'create_event' && d.event) { eventCard(d.event); choices([{ label: '응, 등록해', do: () => sendChat('응, 등록해') }, { label: '아니', do: () => { closeSide(); sendChat('아니'); } }]); }
    else choices([{ label: '네', do: () => sendChat('네') }, { label: '아니요', do: () => sendChat('아니요') }]);
  } else if (m.kind === 'notice') toast((d.text || '').slice(0, 120));
}

let replyId = null, replyText = '';
function onMessage(raw) {
  if (typeof raw !== 'string') { playAudio(raw); return; }
  const m = JSON.parse(raw);
  if (m.type === 'ready') { S.cfg = m;
    if (m.width && m.height) { $('canvas').width = m.width; $('canvas').height = m.height; } $('agent-state').textContent = '연결됨 · v' + m.version; $('text').disabled = false; setListen(S.channel !== 'text' ? 'listening' : 'ready'); }
  else if (m.type === 'chat_delta') { if (replyId !== m.id) { replyId = m.id; replyText = ''; } replyText += m.text || ''; caption(replyText); }
  else if (m.type === 'chat_done') {
    busy(''); const text = m.text || replyText; replyId = null; replyText = '';
    if (text) { addTurn('agent', text); caption(text); const opts = optionsIn(text);
      if (opts.length === 2 && !$('choices').children.length) choices(opts.map(o => ({ label: o, do: () => sendChat(o) }))); }
    if (m.error) addTurn('error', '오류: ' + m.error);
  }
  else if (m.type === 'transcript') { const t = addTurn('user', m.text, { heard: true }); busy('비서가 생각하는 중…'); if (!m.speculative) $('choices').replaceChildren(); }
  else if (m.type === 'display') onDisplay(m);
  else if (m.type === 'tool' && m.state === 'start') busy(TOOL_WORDS[m.name] || '확인하는 중…');
  else if (m.type === 'tool' && m.state === 'done' && m.ok && LINK_TOOLS[m.name]) showLinks(m);
  else if (m.type === 'filler') caption(m.text);
  else if (m.type === 'notice') toast(m.message || m.text || '');
  else if (m.type === 'error') { addTurn('error', m.message || '오류'); busy(''); }
  else if (m.type === 'listen_state') setListen(m.state);
  else if (m.type === 'interrupt') interrupted(m.seq);
}
const TOOL_WORDS = { list_mail: '메일함을 여는 중…', read_mail: '메일을 여는 중…', search_mail: '메일을 찾는 중…', cleanup_mail: '정리하는 중…',
  undo_cleanup: '되돌리는 중…', send_mail: '보낼 메일을 정리하는 중…', cancel_send: '보내기를 멈추는 중…', list_events: '일정을 보는 중…',
  find_free_time: '빈 시간을 찾는 중…', create_event: '일정을 확인하는 중…', create_draft: '초안을 저장하는 중…',
  get_weather: '날씨를 보는 중…', search_news: '뉴스를 찾는 중…', get_news_detail: '기사를 읽는 중…',
  search_geeknews: '긱뉴스를 찾는 중…', read_geeknews: '긱뉴스 글을 읽는 중…', search_wikipedia: '위키백과를 찾는 중…',
  web_search: '인터넷에서 찾는 중…' };
// lookups whose results carry addresses: shown as links under the turn (the assistant does not read them out)
const LINK_TOOLS = { search_news: '뉴스 링크', get_news_detail: '기사 링크', search_geeknews: '긱뉴스 링크',
  read_geeknews: '긱뉴스 링크', search_wikipedia: '위키백과', web_search: '검색 결과' };
function showLinks(m) {
  const seen = new Set(), links = [];
  if (Array.isArray(m.links) && m.links.length) {     // the lookup's own list (news items carry no address in the text)
    const shown = m.links.filter(l => l && /^https?:/.test(l.url || '')).slice(0, 6).map(l => {
      let label = (l.title || '').trim();
      if (!label) { try { label = new URL(l.url).hostname.replace(/^www\./, ''); } catch (e) { label = l.url; } }
      return { url: l.url, label: label.slice(0, 70) };
    });
    if (shown.length) addTurn('links', LINK_TOOLS[m.name], { links: shown });
    return;
  }
  for (const line of String(m.result || '').split('\n')) {
    for (const match of line.matchAll(/https?:\/\/[^\s)\]>'"]+/g)) {
      const url = match[0].replace(/[.,]+$/, '');
      if (seen.has(url)) continue;
      seen.add(url);
      let label = line.slice(0, match.index).replace(/^\s*\d+\.\s*/, '').replace(/[\s:(\-–—|·]+$/, '').trim();
      if (!label) { try { label = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { label = url; } }
      links.push({ url, label: label.slice(0, 70) });
    }
  }
  if (links.length) addTurn('links', LINK_TOOLS[m.name], { links: links.slice(0, 6) });
}
function setListen(state) {
  const pill = $('listen'), text = { listening: '듣는 중', hearing: '듣는 중', speaking: '말하는 중', transcribing: '알아듣는 중', ready: '대화 중', off: '대화 전' }[state] || '대화 중';
  pill.className = 'pill ' + (state === 'speaking' ? 'speaking' : state === 'off' ? 'off' : 'listening'); $('listen-text').textContent = text;
}

// ---- voice: the microphone in, the assistant's voice out (as on the conversation page) ------------
let actx = null, mic = null, out = null, playHead = 0, nodes = [], frames = [], minSeq = 0;
const FPS = () => (S.cfg && S.cfg.fps) || 25;
const workletSource = `class Capture extends AudioWorkletProcessor { constructor() { super(); this.buf = new Int16Array(${PACKET}); this.n = 0; }
  process(inputs) { const ch = inputs[0][0]; if (ch) { for (let i = 0; i < ch.length; i++) { const s = Math.max(-1, Math.min(1, ch[i]));
    this.buf[this.n++] = s < 0 ? s * 32768 : s * 32767; if (this.n === this.buf.length) { const o = this.buf.slice(); this.port.postMessage(o.buffer, [o.buffer]); this.n = 0; } } }
    return true; } } registerProcessor('capture', Capture);`;
// "FHAU": <II> seq, byte count, then 16-bit PCM (voice). "FHRT": seq, sample rate, frame count, PCM bytes, infer ms,
// then PCM and length-prefixed JPEG frames (avatar), as on the conversation page.
async function playAudio(buf) {
  if (!actx) return;
  const view = new DataView(buf), magic = view.getUint32(0, false), seq = view.getUint32(4, true);
  if (seq < minSeq) return;                                 // made before an interrupt
  if (magic === 0x46484155) {
    const pcm = new Int16Array(buf.slice(12, 12 + view.getUint32(8, true)));
    const rate = (S.cfg && S.cfg.sample_rate) || SR;
    schedule(seq, pcm, rate, pcm.length / rate, []);
    return;
  }
  if (magic !== 0x46485254) return;
  const count = view.getUint32(12, true), bytes = view.getUint32(16, true);
  let at = 28;
  const pcm = new Int16Array(buf.slice(at, at + bytes)); at += bytes;
  const blobs = [];
  for (let i = 0; i < count && !document.hidden; i++) {
    const n = view.getUint32(at, true); at += 4;
    blobs.push(new Blob([new Uint8Array(buf, at, n)], { type: 'image/jpeg' })); at += n;
  }
  const pictures = await Promise.all(blobs.map(b => createImageBitmap(b)));
  if (!actx || seq < minSeq) { pictures.forEach(p => p.close()); return; }
  schedule(seq, pcm, SR, count / FPS(), pictures);
}
function schedule(seq, pcm, rate, duration, pictures) {
  const now = actx.currentTime;
  // The first chunk of speech after a rest comes at once (not on the next beat): cut the resting chunk that is
  // playing or waiting, and start speaking now (as in v1, realtime_mic_client.html).
  let silent = true;
  for (let i = 0; i < pcm.length; i += 4) if (pcm[i] > 64 || pcm[i] < -64) { silent = false; break; }
  if (pictures.length && !silent) {
    const ahead = nodes.filter(n => n.t0 + n.duration > now);
    if (ahead.length && ahead.every(n => n.silent)) {
      ahead.forEach(n => { try { n.node.stop(now); } catch (e) { /* ended */ } });
      nodes = nodes.filter(n => !ahead.includes(n));
      frames = frames.filter(f => { if (f.t > now) { f.p.close(); return false; } return true; });
      playHead = now;
    }
  }
  if (pictures.length && playHead - now > 2.2 * duration) { pictures.forEach(p => p.close()); return; }   // fell behind
  const t0 = Math.max(playHead, now + 0.06);
  playHead = t0 + duration;
  if (pcm.length) {
    const b = actx.createBuffer(1, pcm.length, rate), ch = b.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const node = actx.createBufferSource(); node.buffer = b; node.connect(out); node.start(t0);
    nodes = nodes.filter(n => n.t0 + n.duration > now - 1); nodes.push({ node, seq, t0, duration, silent });
  }
  const lag = actx.outputLatency || 0;
  pictures.forEach((p, i) => frames.push({ t: t0 + lag + i / FPS(), p }));
  dropFrames(now);
}
// decoded frames live outside the JS heap and are freed only by close(): a hidden tab draws none, so free them here
function dropFrames(now) { while (frames.length && (frames[0].t < now - 0.2 || frames.length > 120)) frames.shift().p.close(); }
function stopAudio() {
  nodes.forEach(n => { try { n.node.stop(); } catch (e) { /* ended */ } }); nodes = []; playHead = 0;
  frames.forEach(f => f.p.close()); frames = [];
}
// the customer spoke over the assistant: stop, and tell the server how far the sound got (it keeps only what was heard)
function interrupted(firstFresh) {
  if (actx && S.ws && S.ws.readyState === WebSocket.OPEN) {
    const now = actx.currentTime;
    const playing = nodes.filter(n => n.t0 <= now && now < n.t0 + n.duration + 0.05).pop();
    S.ws.send(JSON.stringify({ type: 'played', seq: playing ? playing.seq : null,
                               offset: playing ? Math.min(now - playing.t0, playing.duration) : 0 }));
  }
  stopAudio(); minSeq = firstFresh || 0;
}
const g = $('canvas').getContext('2d');
(function draw() {
  if (actx && frames.length) {
    const now = actx.currentTime;
    let latest = null;
    while (frames.length && frames[0].t <= now) { if (latest) latest.p.close(); latest = frames.shift(); }
    if (latest) { g.drawImage(latest.p, 0, 0, $('canvas').width, $('canvas').height); latest.p.close(); }
  }
  requestAnimationFrame(draw);
})();

async function start() {
  S.channel = document.querySelector('input[name=channel]:checked').value;
  $('toggle').disabled = true;
  try {
    let capture = null;
    if (S.channel !== 'text') {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      actx = new AudioContext({ sampleRate: SR });
      await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' })));
      capture = new AudioWorkletNode(actx, 'capture');
      const silent = actx.createGain(); silent.gain.value = 0;
      actx.createMediaStreamSource(mic).connect(capture).connect(silent).connect(actx.destination);
      out = actx.createGain(); out.connect(actx.destination);
    }
    // every screen this page draws (onDisplay): the server tells the agent if a result could not be shown
    const q = new URLSearchParams({ agent: AGENT, channel: S.channel,
                                    screen: 'mail_list,mail,confirm,cleanup_report,send_pending,calendar,notice' });
    $('video').hidden = S.channel !== 'avatar'; minSeq = 0;
    if (VERSION) q.set('version', VERSION);
    if ($('keep').checked) q.set('keep_content', '1');
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?' + q);
    ws.binaryType = 'arraybuffer'; S.ws = ws;
    ws.onmessage = e => { try { onMessage(e.data); } catch (err) { console.error(err); } };
    ws.onclose = e => {
      if (e.code === 4401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
      if (S.running) stop('연결이 끊어졌습니다.');
    };
    if (capture) capture.port.onmessage = e => { if (ws.readyState === WebSocket.OPEN && S.cfg) ws.send(e.data); };
    S.running = true; $('keep-pill').hidden = !$('keep').checked;
    $('toggle').textContent = '대화 끝내기'; $('toggle').classList.remove('primary');
    document.querySelectorAll('input[name=channel], #keep').forEach(n => { n.disabled = true; });
    $('agent-state').textContent = '연결하는 중…';
  } catch (err) {
    stop(err.name === 'NotAllowedError' ? '마이크 권한이 없습니다. 주소창에서 허용하거나 글로 대화하세요.' : '시작하지 못했습니다: ' + err.message);
  } finally { $('toggle').disabled = false; }
}
function stop(message) {
  S.running = false;
  if (S.ws) { S.ws.onclose = null; try { S.ws.close(); } catch (e) { /* closed */ } S.ws = null; }
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
  stopAudio();
  if (actx) { actx.close(); actx = null; }
  S.cfg = null; $('text').disabled = true; $('keep-pill').hidden = true; setListen('off'); busy('');
  $('toggle').textContent = '대화 시작'; $('toggle').classList.add('primary');
  document.querySelectorAll('input[name=channel], #keep').forEach(n => { n.disabled = false; });
  $('agent-state').textContent = message || '대화를 끝냈습니다';
  if (message) toast(message);
}

function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab ? 'true' : 'false'));
  $('mail-view').hidden = S.tab !== 'mail';
  if (S.tab === 'mail') { renderFilters(); renderMail(); } else renderCal();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  S.tab = t.dataset.tab; render();
  if (S.tab === 'cal' && !S.calendar && S.running) act('show_day', { date: isoDate(new Date()) });
});
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
$('toggle').onclick = () => (S.running ? stop() : start());
$('say').onsubmit = e => { e.preventDefault(); const v = $('text').value.trim(); if (!v) return; $('text').value = ''; $('choices').replaceChildren(); sendChat(v); };
render();
</script>
