guards:
  - id: no_fake_order_done
    kind: claims_lookup
    pattern: "주문\\S{0,2}\\s?(완료|확정|접수)\\S{0,2}\\s?(됐|되었|했)"
    unless_tools: [submit_order]
    nudge: "(시스템 안내: submit_order를 호출하지 않고 주문이 확정된 것처럼 말하려 했습니다. 고객이 동의했다면 submit_order를 호출하세요.)"
  - id: no_allergy_assurance
    kind: regex
    pattern: "알레르기\\S*[^.?!]{0,20}(안전|괜찮|없습니다|없어요)"
    nudge: "(시스템 안내: 알레르기에 대해 안전하다고 단정하지 마세요. search_menu의 성분 정보만 전하고, 확인이 안 되면 직원에게 넘기세요.)"
  # 확정 전 확인을 도구(submit_order) 없이 스스로 묻는 것: 동의가 게이트웨이에 남지 않아 두 번 묻게 된다
  - id: confirm_through_tool
    kind: claims_lookup
    pattern: "(이대로\\s?(주문|진행|확정)|주문(을)?\\s?확정할까요|주문\\s?도와\\s?드릴까요\\?$)"
    unless_tools: [submit_order]
    nudge: "(시스템 안내: 확정 전 확인을 직접 물으려 했습니다. 확인 문장은 submit_order 도구가 만듭니다. 지금 submit_order를 호출하고, 받은 확인 문장을 그대로 읽으세요.)"
  # 넣거나 빼지 않고 그랬다고 말하는 것
  - id: no_fake_add
    kind: claims_lookup
    pattern: "(담았(어요|습니다)|넣었(어요|습니다)|넣어\\s?드렸|추가(했(어요|습니다)|해\\s?드렸)|뺐(어요|습니다)|(변경|바꿔)\\S{0,3}\\s?(담았|넣었|드렸))"
    unless_tools: [add_to_cart, remove_from_cart, get_cart, submit_order]
    nudge: "(시스템 안내: 주문서를 바꾸지 않고 바꾼 것처럼 말하려 했습니다. 넣으려면 지금 add_to_cart를, 빼려면 remove_from_cart를 호출하세요. 아직 물어볼 것이 있으면 넣었다는 말 없이 물어보세요.)"
