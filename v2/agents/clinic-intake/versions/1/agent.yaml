# 의원 예약 접수. 도구는 더미 의원(agentkit/dummy/clinic.py)에 연결된다.
id: clinic-intake
name: 의원 예약 접수
description: 동네 의원의 진료 예약을 받는다. 방문 목적을 듣고 빈 시간을 안내해 예약을 잡는다. 의학적 판단은 하지 않는다
