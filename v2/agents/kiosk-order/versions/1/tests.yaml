# 메뉴와 쿠폰은 더미 카페(agentkit/dummy/cafe.py)에 심어 둔 것이다. 쿠폰: WELCOME10(10% 할인), TEA1000(차 1000원 할인).
# 가상 고객은 대화 시작 때 화면의 메뉴를 글로 받아 보므로, 여기에는 메뉴 id가 아니라 메뉴 이름을 적는다.
# facts.touch: 화면 터치로 할 일. 말하지 않고 누른다(평가 메모 docs/notes/eval.md의 "터치 약속").
#   {action: 정의서의 동작 이름, item: 메뉴 이름, options: {선택 이름: 고를 값 이름}, quantity: 수량}  -> 담기
#   {action: 정의서의 동작 이름, line: 주문 내역에 있는 메뉴 이름}                                   -> 그 줄 빼기
tests:
  personas:
    - id: simple_order
      description: 용건만 짧게 말하는 직장인 고객. 묻는 말에 바로 답한다.
      goal: 아이스 아메리카노(차갑게) 두 잔을 주문하고 결제한다. 다른 것은 필요 없다. 결제 확인 질문에 동의한다
      facts: {order: "아메리카노 차갑게 2잔", payment_consent: true}
      opening: "아이스 아메리카노 두 잔 주세요."
      max_turns: 8
      expect: {order_matches_request: true, consent_before_payment: true, no_invented_prices: true, paid: true, no_staff_needed: true}
    - id: options_unsaid
      description: 키오스크를 처음 쓰는 70대 고객. 말이 느리고, 따뜻한지 차가운지 같은 것은 물어봐야 대답한다.
      goal: 카페 라떼 한 잔을 주문하고 결제한다. 온도를 물으면 따뜻하게라고 답한다. 크기나 샷 추가는 원하지 않는다
      facts: {order: "카페 라떼 따뜻하게 1잔", note: "첫 마디에서는 온도를 말하지 않는다", payment_consent: true}
      opening: "저기, 카페 라떼 한 잔 주세요."
      max_turns: 10
      expect: {order_matches_request: true, consent_before_payment: true, paid: true, no_staff_needed: true}
    - id: change_mind_remove
      description: 말이 많고 우유부단한 고객. 주문하다가 마음을 바꾼다.
      goal: 먼저 아이스 아메리카노 두 잔과 따뜻한 바닐라 라떼 한 잔을 담는다. 그다음 아메리카노 한 잔을 빼 달라고 한다. 아이스 아메리카노 한 잔과 따뜻한 바닐라 라떼 한 잔으로 결제한다
      facts: {first_order: "아메리카노 차갑게 2잔, 바닐라 라떼 따뜻하게 1잔", final_order: "아메리카노 차갑게 1잔, 바닐라 라떼 따뜻하게 1잔", payment_consent: true}
      opening: "아이스 아메리카노 두 잔이랑 따뜻한 바닐라 라떼 한 잔 주세요."
      max_turns: 10
      expect: {order_matches_request: true, consent_before_payment: true, paid: true, no_staff_needed: true}
    - id: recommend_sweet
      description: 무엇을 마실지 정하지 못한 고객. 추천을 듣고 그중에서 고른다.
      goal: 달달한 음료를 추천받고, 상담원이 말해 준 것 중 하나를 골라 한 잔 주문하고 결제한다. 온도를 물으면 차갑게라고 답한다
      facts: {wants: "달달한 음료 1잔", temperature: "차갑게", payment_consent: true}
      opening: "달달한 거 뭐 있어요?"
      max_turns: 10
      expect: {order_matches_request: true, consent_before_payment: true, no_invented_prices: true, paid: true}
    - id: sold_out_item
      description: 디저트를 먹으러 온 고객. 안 된다고 하면 권해 주는 것 중에서 고른다.
      goal: 초코 케이크 한 개를 주문하려 한다. 품절이라고 하면 상담원이 권한 다른 디저트 하나를 골라 한 개 주문하고 결제한다
      facts: {first_choice: "초코 케이크 1개", fallback: "상담원이 권한 디저트 중 하나 1개", payment_consent: true}
      opening: "초코 케이크 하나 주세요."
      max_turns: 10
      expect: {sold_out_not_ordered: true, order_matches_request: true, consent_before_payment: true, no_staff_needed: true}
    - id: coupon_user
      description: 쿠폰을 챙겨 온 알뜰한 고객. 할인이 됐는지 꼭 확인한다.
      goal: 따뜻한 카페 라떼 한 잔을 담고, 쿠폰 코드 WELCOME10을 말해 할인을 받은 뒤 결제한다
      facts: {order: "카페 라떼 따뜻하게 1잔", coupon_code: "WELCOME10", payment_consent: true}
      opening: "따뜻한 카페 라떼 한 잔 주세요."
      max_turns: 10
      expect: {order_matches_request: true, consent_before_payment: true, no_invented_prices: true, paid: true}
    - id: decline_at_payment
      description: 조심스러운 고객. 합계를 듣고 나서 마음을 바꾼다.
      goal: 아이스 아메리카노 한 잔을 담고 결제하겠다고 한다. 상담원이 주문 내용과 합계를 읽고 결제할지 물으면 "아니요, 다음에 올게요"라고 거절하고 떠난다. 결제는 하지 않는다
      facts: {order: "아메리카노 차갑게 1잔", payment_consent: false}
      opening: "아이스 아메리카노 한 잔만 주세요."
      max_turns: 8
      expect: {consent_before_payment: true, declined_payment_not_charged: true, paid: false, no_staff_needed: true}
    - id: touch_and_talk
      description: 말과 화면 터치를 섞어 쓰는 젊은 고객. 말이 짧다.
      goal: 아이스 아메리카노 한 잔은 말로 주문하고, 바닐라 라떼 한 잔은 말하지 않고 화면에서 눌러 담는다. 두 잔이 주문 내역에 있으면 결제한다
      facts:
        spoken_order: "아메리카노 차갑게 1잔"
        payment_consent: true
        touch:
          - {action: add_item, item: "바닐라 라떼", options: {온도: 차갑게}, quantity: 1}
      opening: "아이스 아메리카노 한 잔 주세요."
      max_turns: 10
      expect: {order_matches_request: true, consent_before_payment: true, paid: true, no_staff_needed: true}
    - id: wants_cash
      description: 현금만 가진 고객. 직원을 불러 준다고 하면 기다린다.
      goal: 따뜻한 아메리카노 한 잔을 현금으로 사려고 한다. 주문하기 전에 현금으로 낼 수 있는지부터 묻는다
      facts: {order: "아메리카노 따뜻하게 1잔", payment: "현금"}
      opening: "여기 현금으로 계산할 수 있어요?"
      max_turns: 6
      expect: {no_staff_needed: false, paid: false}
  cases:
    - id: case_simple_order
      description: 말로 주문하고 결제까지 끝낸다 (S12의 2, 6단계)
      user_turns:
        - "아이스 아메리카노 두 잔 주세요."
        - "아니요, 그게 다예요. 결제할게요."
        - "네, 결제해 주세요."
      expect: {order_matches_request: true, consent_before_payment: true, paid: true, no_staff_needed: true}
    - id: case_decline_payment
      description: 결제 확인 질문에 거절하면 결제하지 않는다
      user_turns:
        - "따뜻한 카페 라떼 한 잔 주세요."
        - "이제 결제할게요."
        - "아니요, 결제하지 마세요. 다음에 올게요."
      expect: {consent_before_payment: true, declined_payment_not_charged: true, paid: false}
    - id: case_asks_staff
      description: 직원을 찾으면 바로 넘긴다 (S12의 8단계)
      user_turns:
        - "직원분 좀 불러 주세요."
      expect: {no_staff_needed: false, paid: false}
