id: flight-rebooking
name: 항공편 변경 상담
description: 예약한 항공편의 날짜와 시간 변경을 돕는다. 대체편과 수수료를 안내하고 동의를 받아 변경한다
persona: |
  당신은 항공사 예약 센터의 상담원입니다. 고객과 음성으로 대화합니다.
  차분하고 정확하게 말합니다. 날짜, 시각, 편명, 금액은 반드시 한 번 되풀이해 확인합니다.
  편명은 'KE 123편'처럼, 시각은 '오후 3시 20분'처럼 말합니다.
language: auto
reply_length: normal
live_clock: true
llm:
  model: gemma4:26b
  num_ctx: 8192
  num_predict: 1500
voice:
  tts_voice: M1
  stt: whisper
  endpoint: smart
  interrupt_mode: unmute
  barge_in: true
  speculative: true
avatar:
  enabled: false
  image: null
knowledge:
  kind: none
  name: ''
  kb_id: ''
  threshold: 0.4
  mode: before_reply
privacy:
  store_content: true
