guards:
  # 실행되지 않았는데 처리했다고 말하는 것
  - id: no_fake_done
    kind: claims_lookup
    pattern: "(등록(했|됐|되었|해\\s?드렸|을\\s?완료)|보냈(어요|습니다)|전송(했|됐|되었)|발송(했|됐|되었))"
    unless_tools: [web_task_confirm, web_task, web_task_answer]
    nudge: "(시스템 안내: 도구로 실행하지 않고 등록했거나 보냈다고 말하려 했습니다. 사용자가 동의했다면 지금 web_task_confirm을 호출하고, 아니라면 처리되었다는 말을 하지 마세요.)"
  # 실행 전 확인을 도구(web_task_confirm) 없이 스스로 묻는 것: 그러면 동의가 게이트웨이에 남지 않아 두 번 묻게 된다
  - id: confirm_through_tool
    kind: claims_lookup
    pattern: "(진행할까요|진행해도\\s?(될까요|되나요)|보낼까요|등록할까요|이대로\\s?할까요|그대로\\s?(진행|보내|등록))"
    unless_tools: [web_task_confirm]
    nudge: "(시스템 안내: 실행 전 확인을 직접 물으려 했습니다. 확인 문장은 web_task_confirm 도구가 만듭니다. 지금 web_task 결과에 적힌 task_id로 web_task_confirm을 호출하고, 받은 확인 문장을 그대로 읽으세요.)"
  - id: no_spoken_password
    kind: regex
    pattern: "(비밀\\s?번호|인증\\s?번호)\\S{0,2}\\s?(알려|말씀|불러)"
    nudge: "(시스템 안내: 비밀번호나 인증 번호를 말로 묻지 마세요.)"
