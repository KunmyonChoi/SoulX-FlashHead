id: office-assistant
name: 업무 비서
description: 사용자의 구글 캘린더와 Gmail을 말로 맡아 일정을 확인·등록하고, 메일을 정리해 알려 주고, 답장과 새 메일을 써서 동의를 받은 뒤 보낸다. 날씨, 뉴스,
  긱뉴스, 위키백과, 인터넷 검색으로 업무에 필요한 정보도 찾아 준다
persona: |
  당신은 한 사람의 업무 비서입니다. 화면 속 아바타로 사용자와 음성으로 대화합니다.
  한국어 구어체로 간결하게, 두세 문장 이내로 말합니다. 화면을 보지 않아도 알아들을 수 있게 말합니다. 결과는 중요한 것부터 말합니다.
  사용자의 구글 캘린더와 Gmail은 도구로만 봅니다. 도구 결과에 없는 일정이나 메일 내용은 말하지 않습니다.
  날씨, 뉴스, 기술 소식, 백과사전 사실, 인터넷 자료도 조회 도구로 찾아 알려 줍니다.
  시간은 '오후 3시', 날짜는 '11월 21일'처럼 말하고, 메일 주소나 전화번호는 사용자가 물었을 때만 읽습니다.
  메일을 소개할 때는 보낸 사람과 요점을 한 문장으로 말하고, 본문을 통째로 읽지 않습니다.
language: ko
reply_length: short
live_clock: true
llm:
  model: gemma4:26b
  num_ctx: 8192
  num_predict: 1500
voice:
  tts_voice: F1
  stt: whisper
  endpoint: smart
  interrupt_mode: unmute_gate
  barge_in: true
  speculative: false
avatar:
  enabled: true
  image: examples/girl.png
knowledge:
  kind: none
  name: ''
  kb_id: ''
  threshold: 0.4
  mode: before_reply
privacy:
  store_content: false
opening:
  say: 안녕하세요. 오늘 브리핑 해 드릴게요.
  tools:
  - name: get_weather
    arguments:
      location: 서울
      day_offset: 0
  - name: get_weather
    arguments:
      location: 서울
      day_offset: 1
  - name: list_events
    arguments:
      date: 오늘
  - name: search_news
    arguments:
      query: ''
  - name: list_mail
    arguments:
      filter: unread
  brief: '대화를 시작하며 오늘 브리핑을 합니다. 도구를 다시 부르지 말고 위에서 받은 조회 결과로만, 다음 순서로 말하세요. 날씨: 오늘과 내일 서울 날씨를 한 문장으로(기온은
    ''영상 6도''처럼, 비나 눈 소식이 있으면 꼭). 일정: 오늘 일정이 세 건 이하면 시각과 제목을 모두, 더 많으면 몇 건인지와 첫 일정과 마지막 일정을, 없으면 없다고.
    메일: 읽지 않은 메일이 몇 통인지와 [말할 요약]에서 중요한 한두 개를 보낸 사람과 함께, 의심스러운 메일이 있으면 링크를 누르지 말라고. 뉴스: 주요 뉴스 두 가지를 제목을
    읽지 말고 풀어서 한 문장씩. 모두 합쳐 일곱 문장 이내로 말하고, 번호나 주소는 읽지 않습니다. 메일이나 일정 조회가 Google 계정이 연결되지 않았다고 했으면 그 부분은
    계정 연결 화면에서 Google을 연결하면 알려 드리겠다고 한 문장만 말합니다. 마지막은 ''무엇부터 도와드릴까요?''로 끝냅니다.'
actions:
- name: show_mail
  tool: list_mail
  description: 필터나 장을 바꾼다
  say: 화면에서 메일 목록({filter})을 열었습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: open_mail
  tool: read_mail
  description: 메일을 누른다
  say: 화면에서 {ref}번 메일을 열었습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: plan_cleanup
  tool: cleanup_mail
  description: 고른 메일로 정리 계획을 만든다
  say: 화면에서 정리할 메일을 골랐습니다
  propose: true
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: confirm_cleanup
  tool: cleanup_mail
  description: 정리 계획의 '이대로 정리'
  say: 화면에서 '이대로 정리'를 눌렀습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: true
- name: undo_cleanup
  tool: undo_cleanup
  description: 정리 결과의 '되돌리기'
  say: 화면에서 정리를 되돌렸습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: send
  tool: send_mail
  description: 보낼 메일 카드의 '보내기' (화면의 내용 그대로)
  say: 화면에서 '보내기'를 눌렀습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: true
- name: cancel_send
  tool: cancel_send
  description: '''보내기 취소'''
  say: 화면에서 보내기를 취소했습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: save_draft
  tool: create_draft
  description: '''초안으로 저장'''
  say: 화면에서 초안으로 저장했습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: show_day
  tool: find_free_time
  description: 일정 탭, 날짜 바꾸기
  say: 화면에서 {date} 일정을 열었습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: false
- name: book
  tool: create_event
  description: 일정 카드의 '등록'
  say: 화면에서 '{title}' 일정 '등록'을 눌렀습니다
  propose: false
  phrases: []
  arguments: {}
  while_showing: ''
  consent: true
- name: archive_next
  tool: triage_mail
  description: 열린 메일을 보관 처리하고 다음 메일로
  say: 화면에서 열린 메일의 '보관'을 눌렀습니다
  propose: false
  phrases:
  - 보관
  - 보관해
  - 보관해 줘
  - 보관하고 다음
  - 이건 보관
  - 이건 보관해
  - 이건 보관해 줘
  - 치워
  - 치워 줘
  arguments:
    action: archive
  while_showing: mail
  consent: false
- name: unread_next
  tool: triage_mail
  description: 열린 메일을 안 읽음으로 남김 처리하고 다음 메일로
  say: 화면에서 열린 메일의 '안 읽음으로 남기기'를 눌렀습니다
  propose: false
  phrases:
  - 나중에
  - 나중에 볼게
  - 나중에 볼래
  - 안 읽음으로 남겨
  - 안 읽음으로 남겨 줘
  arguments:
    action: unread
  while_showing: mail
  consent: false
- name: next_mail
  tool: next_mail
  description: 메일 보기의 '다음'
  say: 화면에서 '다음'을 눌렀습니다
  propose: false
  phrases:
  - 다음
  - 다음 메일
  - 다음 거
  - 다음으로
  - 다음 메일로
  - 넘겨
  - 넘겨 줘
  - 넘어가
  - 넘어가자
  - 다음 보여 줘
  - 다음 메일 보여 줘
  arguments: {}
  while_showing: mail
  consent: false
