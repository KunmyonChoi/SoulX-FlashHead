# 쇼핑몰: 배송 추적. 본인 확인이 끝난 주문만 볼 수 있다.
name: track_delivery
description: 본인 확인이 끝난 주문의 배송 상태(준비 중, 배송 중, 배송 완료), 택배사, 운송장 번호, 현재 위치, 도착 예정일을 조회한다. 고객이 배송이 어디까지 왔는지, 언제 오는지 물으면 사용한다.
effect: read
input_schema:
  type: object
  properties:
    order_id: {type: string, description: "주문번호. 예: A1001"}
  required: [order_id]
output_schema:
  type: object
  properties:
    order_id: {type: string}
    status: {type: string, enum: [preparing, in_transit, delivered]}
    status_text: {type: string}
    carrier: {type: string}
    tracking_number: {type: string}
    current_location: {type: string}
    expected_ship_date: {type: string}
    expected_delivery_date: {type: string}
    delivered_at: {type: string}
    address: {type: string}
    events: {type: array}
requires: [verified]
timeout_s: 4.0
retries: 1
pii_input: []
pii_output: [address]
filler: "배송 상태를 확인해 볼게요."
adapter: {kind: dummy, target: "shop:track_delivery"}
