# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: cleanup_mail
description: 메일 여러 통을 번호로 정리한다(읽음, 안 읽음, 보관, 스팸, 휴지통. 되돌릴 수 있다). 처음 호출은 계획과 확인 문장만 돌려주고, 사용자가 동의하면 같은 인자로 다시 호출해야 정리된다.
effect: write
input_schema:
  type: object
  properties:
    spam:
      type: string
      description: 스팸으로 옮길 번호들
    archive:
      type: string
      description: 보관할 번호들
    read:
      type: string
      description: 읽음으로 할 번호들
    unread:
      type: string
      description: 안 읽음으로 할 번호들
    trash:
      type: string
      description: 휴지통으로 옮길 번호들
output_schema:
  type: string
  description: 모델에 전할 글
confirm_template: '{sentence}'
idempotency_fields:
- spam
- archive
- read
- unread
- trash
timeout_s: 15.0
retries: 0
pii_input: []
pii_output: []
filler: 정리할 메일을 모아 볼게요.
display:
  kind: cleanup_report
  path: report
adapter:
  kind: python
  target: agentkit.tools.google:cleanup_mail
  options:
    preview: agentkit.tools.google:preview_cleanup_mail
