# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: list_mail
description: 받은편지함을 화면에 표로 띄우고 번호를 붙인다. '메일 보여 줘', '읽지 않은 메일', '광고 메일', '답장할 메일', '다음 장'에 쓴다.
effect: read
input_schema:
  type: object
  properties:
    filter:
      type: string
      enum:
      - unread
      - reply
      - ads
      - all
      description: unread 읽지 않음(광고 제외), reply 답장 필요, ads 광고·알림, all 전체
      default: unread
    page:
      type: integer
      description: 몇 번째 장(한 장 10통)
      minimum: 1
      default: 1
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 15.0
retries: 1
pii_input: []
pii_output: []
filler: 메일함을 열어 볼게요.
display:
  kind: mail_list
  path: listing
adapter:
  kind: python
  target: agentkit.tools.google:list_mail
