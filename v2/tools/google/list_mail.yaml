# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: list_mail
description: Gmail 받은편지함을 화면에 표로 보여 주고 번호를 붙인다. '메일 목록 보여 줘', '읽지 않은 메일', '광고 메일 보여 줘', '답장해야 할 메일', '다음 장'처럼 물으면 쓴다. 결과는
  화면에 있으니 다 읽어 주지 말고 요점만 말한다.
effect: read
input_schema:
  type: object
  properties:
    filter:
      type: string
      enum:
      - unread
      - reply
      - ads
      - all
      description: unread 읽지 않음(광고 제외), reply 답장이 필요해 보임, ads 광고·알림, all 받은편지함 전체
      default: unread
    page:
      type: integer
      description: 몇 번째 장. 한 장에 10통
      minimum: 1
      default: 1
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 15.0
retries: 1
pii_input: []
pii_output: []
filler: 메일함을 열어 볼게요.
display:
  kind: mail_list
  path: listing
adapter:
  kind: python
  target: agentkit.tools.google:list_mail
