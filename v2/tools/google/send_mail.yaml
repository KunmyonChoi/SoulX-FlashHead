# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
# 쓰기와 보내기를 한 번의 두 단계 변경으로: 확인 문장 → 사용자의 동의 → 보냄. (초안 도구와 보내기 도구를 모델이 이어 부르게 하면
# 모델이 스스로 '보낼까요?'를 묻다가 막히는 일이 잦았다, 2026-11-20)
name: send_mail
description: 메일을 써서 보낸다. 답장이면 reply_to에 메일 목록의 번호를, 새 메일이면 to에 받는 사람 이름이나 주소를 넣고, 본문은 사용자가 말한 뜻을 정중한 메일 문장으로 쓴다. 처음 호출하면 보내지
  않고 받는 사람, 제목, 내용 요지를 읽어 줄 확인 문장이 돌아온다. 사용자가 동의하면 같은 인자로 다시 호출해야 보내진다. 동의하면 10초 뒤에 보내지고, 그 안에는 cancel_send로 멈출 수 있다.
effect: write
input_schema:
  type: object
  properties:
    to:
      type: string
      description: 받는 사람 이름이나 메일 주소. 답장이면 비운다
    reply_to:
      type: string
      description: 답장할 메일의 목록 번호. 새 메일이면 비운다
    subject:
      type: string
      description: 제목. 답장이면 비워도 된다
    body:
      type: string
      description: 본문
  required:
  - body
output_schema:
  type: string
  description: 모델에 전할 글
confirm_template: '{sentence}'
# 확인 문장을 들은 사용자가 '더 정중하게', '그 문장 빼'처럼 고쳐 달라고 하면 고친 본문으로 다시 부를 수 있고,
# 새 확인이 기다리던 확인을 대신한다 (고치기 전 내용이 나중의 '응'으로 보내지지 않게).
revisable: true
idempotency_fields:
- to
- reply_to
- subject
- body
timeout_s: 10.0
retries: 0
pii_input:
- to
- subject
- body
pii_output: []
filler: 보낼 메일을 정리해 볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:send_mail
  options:
    preview: agentkit.tools.google:preview_send_mail
display:
  kind: send_pending
  path: pending
