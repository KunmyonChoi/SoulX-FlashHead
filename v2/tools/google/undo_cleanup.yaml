# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: undo_cleanup
description: 방금 한 메일 정리를 되돌린다. refs를 비우면 그 정리 전체를, 번호를 주면 그 메일만 원래대로 돌린다.
effect: write
input_schema:
  type: object
  properties:
    report_id:
      type: string
      description: cleanup_mail 결과의 report_id. 비우면 가장 최근 정리
    refs:
      type: string
      description: 되돌릴 메일의 목록 번호들. 비우면 전부
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 15.0
retries: 0
pii_input: []
pii_output: []
filler: 원래대로 돌려 볼게요.
display:
  kind: cleanup_report
  path: report
adapter:
  kind: python
  target: agentkit.tools.google:undo_cleanup
