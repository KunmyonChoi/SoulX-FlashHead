# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: undo_cleanup
description: 방금 한 메일 정리나 보관을 되돌린다.
effect: write
input_schema:
  type: object
  properties:
    report_id:
      type: string
      description: 비우면 가장 최근 것
    refs:
      type: string
      description: 되돌릴 번호들. 비우면 전부
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 15.0
retries: 0
pii_input: []
pii_output: []
filler: 원래대로 돌려 볼게요.
display:
  kind: cleanup_report
  path: report
adapter:
  kind: python
  target: agentkit.tools.google:undo_cleanup
