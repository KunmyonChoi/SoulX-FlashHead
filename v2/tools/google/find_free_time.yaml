# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: find_free_time
description: 캘린더에서 하루 중 비는 시간을 찾는다. 약속을 잡기 전이나 '내일 한 시간 비는 때 있어?'에 쓴다.
effect: read
input_schema:
  type: object
  properties:
    date:
      type: string
      description: 사용자가 말한 날짜 그대로('내일', '다음 주 수요일', '25일'). 직접 계산하지 않는다. 정해진 날짜면 YYYY-MM-DD
    duration_min:
      type: integer
      description: 필요한 길이(분). 기본 30
      default: 30
    from:
      type: string
      description: 찾기 시작 HH:MM. 기본 09:00
    to:
      type: string
      description: 찾기 끝 HH:MM. 기본 18:00
  required:
  - date
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input: []
pii_output: []
filler: 빈 시간을 찾아볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:find_free_time
display:
  kind: calendar
  path: calendar
