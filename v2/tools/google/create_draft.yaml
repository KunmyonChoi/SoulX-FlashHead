# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: create_draft
description: Gmail에 보낼 메일의 초안을 만든다(보내지 않는다). 새 메일이면 to에 받는 사람 이름이나 주소를, 받은 메일에 답장이면 reply_to에 그 메일의 번호를 넣는다. 본문은 사용자가 말한 뜻을
  정중한 메일 문장으로 쓴다.
effect: write
input_schema:
  type: object
  properties:
    to:
      type: string
      description: 받는 사람 이름이나 메일 주소. 답장이면 비운다
    reply_to:
      type: string
      description: 답장할 메일의 목록 번호. 새 메일이면 비운다
    subject:
      type: string
      description: 제목. 답장이면 비워도 된다
    body:
      type: string
      description: 본문
  required:
  - body
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 0
pii_input:
- to
- subject
- body
pii_output: []
filler: 초안을 써 볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:create_draft
