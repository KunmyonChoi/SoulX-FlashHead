# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: cancel_send
description: 방금 보내기로 한 메일을 멈춘다(동의 뒤 10초 안). '취소', '보내지 마'에 바로 부른다.
effect: write
input_schema:
  type: object
  properties:
    send_id:
      type: string
      description: 비우면 가장 최근 것
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 5.0
retries: 0
pii_input: []
pii_output: []
filler: 보내기를 멈출게요.
display:
  kind: send_pending
  path: pending
adapter:
  kind: python
  target: agentkit.tools.google:cancel_send
