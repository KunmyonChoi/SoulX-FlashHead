# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: create_event
description: 구글 캘린더에 일정을 등록한다. 처음 호출하면 등록되지 않고 사용자에게 읽어 줄 확인 문장이 돌아온다(같은 시간 일정이 있으면 함께 알려 준다). 사용자가 동의하면 같은 인자로 다시 호출한다. 참석자에게
  초대 메일은 보내지 않는다.
effect: write
input_schema:
  type: object
  properties:
    title:
      type: string
      description: '일정 제목. 예: 예산 회의'
    date:
      type: string
      description: '사용자가 말한 날짜 표현을 그대로 적는다. 예: ''다음 주 수요일'', ''내일'', ''모레'', ''11월 25일'', ''25일'', ''3일 뒤''. 직접 날짜를 계산해 바꾸지
        않는다(서버가 계산한다). 이미 정해진 날짜면 YYYY-MM-DD도 된다'
    start:
      type: string
      description: '시작 시각 HH:MM(24시간). 예: 15:00'
    duration_min:
      type: integer
      description: 길이(분). 말하지 않았으면 30
      default: 30
    attendees:
      type: string
      description: '함께하는 사람 이름들을 쉼표로. 예: 김민수, 이서연'
    location:
      type: string
      description: 장소. 말하지 않았으면 비운다
  required:
  - title
  - date
  - start
output_schema:
  type: string
  description: 모델에 전할 글
confirm_template: '{sentence}'
idempotency_fields:
- title
- date
- start
timeout_s: 10.0
retries: 0
pii_input:
- attendees
- location
pii_output: []
filler: 일정 내용을 확인할게요.
adapter:
  kind: python
  target: agentkit.tools.google:create_event
  options:
    preview: agentkit.tools.google:preview_create_event
display:
  kind: calendar
  path: calendar
