# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: create_event
description: 캘린더에 일정을 등록한다. 처음 호출은 확인 문장만 돌려주고(겹치는 일정도 알려 준다), 사용자가 동의하면 같은 인자로 다시 호출해야 등록된다. 초대 메일은 보내지 않는다.
effect: write
input_schema:
  type: object
  properties:
    title:
      type: string
      description: 일정 제목
    date:
      type: string
      description: 사용자가 말한 날짜 그대로('내일', '다음 주 수요일', '25일'). 직접 계산하지 않는다. 정해진 날짜면 YYYY-MM-DD
    start:
      type: string
      description: 시작 시각 HH:MM(24시간)
    duration_min:
      type: integer
      description: 길이(분). 기본 30
      default: 30
    attendees:
      type: string
      description: 함께하는 사람 이름들, 쉼표로
    location:
      type: string
      description: 장소
  required:
  - title
  - date
  - start
output_schema:
  type: string
  description: 모델에 전할 글
confirm_template: '{sentence}'
idempotency_fields:
- title
- date
- start
timeout_s: 10.0
retries: 0
pii_input:
- attendees
- location
pii_output: []
filler: 일정 내용을 확인할게요.
adapter:
  kind: python
  target: agentkit.tools.google:create_event
  options:
    preview: agentkit.tools.google:preview_create_event
display:
  kind: calendar
  path: calendar
