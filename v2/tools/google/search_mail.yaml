# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: search_mail
description: 보낸 사람이나 주제로 메일을 찾아 화면에 띄운다. '김민수가 보낸 메일', '계약서 메일 찾아 줘'에 쓴다.
effect: read
input_schema:
  type: object
  properties:
    query:
      type: string
      description: 찾을 이름이나 낱말
  required:
  - query
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input:
- query
pii_output: []
filler: 메일을 찾아볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:search_mail
display:
  kind: mail_list
  path: listing
