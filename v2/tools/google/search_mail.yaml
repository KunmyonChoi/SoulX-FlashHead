# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: search_mail
description: Gmail에서 보낸 사람이나 주제로 메일을 찾는다. '김민수가 보낸 메일', '계약서 메일 찾아 줘'처럼 물으면 쓴다. 결과의 번호로 read_mail을 부를 수 있다.
effect: read
input_schema:
  type: object
  properties:
    query:
      type: string
      description: '찾을 사람 이름이나 낱말. 예: 김민수 계약서'
  required:
  - query
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input:
- query
pii_output: []
filler: 메일을 찾아볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:search_mail
