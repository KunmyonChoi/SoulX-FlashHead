# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: send_draft
description: 만들어 둔 초안을 보낸다. 처음 호출은 확인 문장만 돌려주고, 동의하면 같은 초안 번호로 다시 호출한다.
effect: write
input_schema:
  type: object
  properties:
    draft_id:
      type: string
      description: create_draft가 돌려준 초안 번호
  required:
  - draft_id
output_schema:
  type: string
  description: 모델에 전할 글
confirm_template: '{to}에게 ''{subject}'' 메일을 보낼까요? 내용은 ''{gist}''입니다.'
idempotency_fields:
- draft_id
timeout_s: 10.0
retries: 0
pii_input: []
pii_output: []
filler: 보낼 메일을 확인할게요.
adapter:
  kind: python
  target: agentkit.tools.google:send_draft
  options:
    preview: agentkit.tools.google:preview_send_draft
display:
  kind: send_pending
  path: pending
