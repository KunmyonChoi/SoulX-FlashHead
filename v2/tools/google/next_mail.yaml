# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
# 메일을 한 통씩 넘겨 보기: 화면 목록의 순서대로, 아직 열지 않은 다음 메일을 연다.
name: next_mail
description: 화면 목록에서 아직 열지 않은 다음 메일을 열고 본문을 읽는다. '하나씩 보자', '첫 메일부터', '다음', '넘겨'에 쓴다. 번호가 필요 없고, 목록이 화면에 있으면 list_mail을 다시 부르지 않는다.
effect: read
input_schema:
  type: object
  properties: {}
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input: []
pii_output: []
filler: 다음 메일 열어 볼게요.
display:
  kind: mail
  path: mail
adapter:
  kind: python
  target: agentkit.tools.google:next_mail
