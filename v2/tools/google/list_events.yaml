# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: list_events
description: 캘린더 일정을 날짜로 본다. '오늘 일정', '내일 뭐 있어', '이번 주 일정'에 쓴다.
effect: read
input_schema:
  type: object
  properties:
    date:
      type: string
      description: 사용자가 말한 날짜 그대로('내일', '다음 주 수요일', '25일'). 직접 계산하지 않는다. 정해진 날짜면 YYYY-MM-DD
    days:
      type: integer
      description: 며칠치. 하루면 1
      minimum: 1
      maximum: 14
      default: 1
  required:
  - date
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input: []
pii_output: []
filler: 일정을 확인해 볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:list_events
display:
  kind: calendar
  path: calendar
