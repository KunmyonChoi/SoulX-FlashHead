# 구글 캘린더·Gmail (agentkit/tools/google.py). 시험의 가상 고객은 언제나 가짜 Google을 쓴다.
name: list_events
description: 구글 캘린더의 일정을 날짜로 본다. '오늘 일정', '내일 뭐 있어', '이번 주 일정'처럼 물으면 쓴다.
effect: read
input_schema:
  type: object
  properties:
    date:
      type: string
      description: 시작 날짜 YYYY-MM-DD. 오늘 날짜를 기준으로 '내일'은 하루 뒤로 바꿔 적는다
    days:
      type: integer
      description: 며칠치를 볼지. 하루면 1, 이번 주면 남은 날 수
      minimum: 1
      maximum: 14
      default: 1
  required:
  - date
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 10.0
retries: 1
pii_input: []
pii_output: []
filler: 일정을 확인해 볼게요.
adapter:
  kind: python
  target: agentkit.tools.google:list_events
display:
  kind: calendar
  path: calendar
