# 항공: 항공편 변경(변경 도구, 확인 필요). 처음 호출하면 확인 문장만 나오고, 고객이 다음 말에서 동의한 뒤
# 같은 인자로 다시 호출해야 변경된다. {flight}, {departure}, {total}은 더미 항공사의 미리보기가 채운다.
name: change_flight
description: 예약을 다른 항공편으로 바꾼다. quote_change_fee로 금액을 확인한 뒤에 호출한다. 처음 호출하면 변경되지 않고 고객에게 읽어 줄 확인 문장(편명, 출발 일시, 금액)이 돌아온다. 고객이 동의하면 같은 인자로 다시 호출한다.
effect: write
input_schema:
  type: object
  properties:
    booking_ref: {type: string, description: "예약번호"}
    flight_no: {type: string, description: "바꿀 편명. 예: KE 1204"}
    date: {type: string, description: "그 편의 날짜. 2026-11-22 형식"}
  required: [booking_ref, flight_no, date]
output_schema:
  type: object
  properties:
    booking_ref: {type: string}
    flight_no: {type: string}
    departure: {type: string}
    charged: {type: integer}
requires: [verified]
confirm_template: "{flight}, {departure} 출발로 변경합니다. 수수료와 운임 차액은 모두 {total}입니다. 변경할까요?"
idempotency_fields: [booking_ref, flight_no, date]
timeout_s: 4.0
retries: 0
filler: "변경 내용을 확인할게요."
adapter: {kind: python, target: "agentkit.dummy.airline:change_flight", options: {preview: "agentkit.dummy.airline:preview_change_flight"}}
