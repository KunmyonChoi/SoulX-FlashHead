# 카페(키오스크): 주문 내역에서 빼기(변경 도구, 확인 단계 없음). 뺀 뒤 get_cart로 화면을 다시 그린다.
name: remove_from_cart
description: 주문 내역에서 메뉴를 빼거나 수량을 줄인다. 고객이 담은 것을 빼거나 줄여 달라고 할 때 사용한다. 호출하면 바로 빠지고 화면의 주문 내역이 바뀐다. quantity를 주지 않으면 그 줄 전체를 뺀다.
effect: write
input_schema:
  type: object
  properties:
    line_id: {type: string, description: "뺄 줄의 번호. add_to_cart나 get_cart 결과의 line_id. 예: L1"}
    quantity: {type: integer, description: "줄일 수량. 주지 않으면 줄 전체를 뺀다", minimum: 1, maximum: 20}
  required: [line_id]
output_schema:
  type: object
  properties:
    line_id: {type: string}
    removed: {type: integer, description: "뺀 수량"}
    line: {type: object, description: "남은 줄. 줄이 없어졌으면 null"}
    cart: {type: object, description: "뺀 뒤의 주문 내역. get_cart와 같은 모양"}
idempotency_fields: []
timeout_s: 4.0
retries: 0
filler: "네, 빼 드릴게요."
display: {kind: cart, path: cart, refresh: [get_cart]}
adapter: {kind: dummy, target: "cafe:remove_from_cart"}
# 성공하면 모델을 한 번 더 부르지 않고 이 문장으로 바로 답한다(응답 지연 약 1초 단축). 실패하면 모델이 답한다.
reply: {say: "{spoken} 뺐어요.", closing: "더 필요하신 거 있으세요?"}
