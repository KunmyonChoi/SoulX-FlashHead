# 카페(키오스크): 주문 내역에 담기(변경 도구). confirm_template이 없으므로 확인 단계 없이 바로 담긴다
# (세션 안에서만 유효하고 되돌릴 수 있다). 담은 뒤 get_cart로 화면의 주문 내역을 다시 그린다.
# 같은 인자로 다시 부르면 한 번 더 담긴다(더미 카페가 "repeatable"로 답한다).
name: add_to_cart
description: 메뉴를 주문 내역에 담는다. 고객이 메뉴를 주문하거나 추가할 때 사용한다. 호출하면 바로 담기고 화면의 주문 내역이 바뀐다. 온도를 골라야 하는 메뉴인데 고객이 말하지 않았으면 호출하기 전에 먼저 물어본다. 품절이거나 옵션이 맞지 않으면 담기지 않고 이유가 돌아온다. 메뉴가 여러 가지면 메뉴마다 한 번씩 호출한다.
effect: write
input_schema:
  type: object
  properties:
    item_id: {type: string, description: "메뉴 id. get_menu나 search_menu 결과의 영문 id. 예: americano, vanilla_latte"}
    quantity: {type: integer, description: "수량. 말하지 않았으면 1", minimum: 1, maximum: 20, default: 1}
    options:
      type: object
      description: "옵션 id와 선택 id의 묶음. 예: {\"temperature\": \"ice\", \"size\": \"large\"}. 고객이 말한 것만 넣는다"
      properties:
        temperature: {type: string, enum: [hot, ice], description: "온도. hot 따뜻하게, ice 차갑게"}
        size: {type: string, enum: [regular, large], description: "크기. regular 기본, large 크게(+500원)"}
        shot: {type: string, enum: [none, one, two], description: "샷 추가. one 1샷(+500원), two 2샷(+1000원)"}
  required: [item_id]
output_schema:
  type: object
  properties:
    line: {type: object, description: "담긴 줄. {line_id, item_id, name, options, quantity, unit_price, line_total}"}
    added: {type: integer, description: "이번에 담은 수량"}
    cart: {type: object, description: "담은 뒤의 주문 내역. get_cart와 같은 모양"}
idempotency_fields: []
timeout_s: 4.0
retries: 0
filler: "네, 담아 드릴게요."
display: {kind: cart, path: cart, refresh: [get_cart]}
adapter: {kind: dummy, target: "cafe:add_to_cart"}
