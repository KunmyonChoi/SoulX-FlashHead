# 비서: 웹 사이트(더미 오피스: 일정, 주소록, 메일)에서 해야 하는 일을 브라우저 조작 서비스에 맡긴다 (v2/browser/service.py).
# 조회로 분류한다: 이 도구만으로는 아무것도 바뀌지 않는다. 등록·전송처럼 되돌릴 수 없는 단추 앞에서는 멈추고,
# 실제로 누르는 것은 web_task_confirm(변경 도구, 고객 동의 필요)이다.
name: web_task
description: 사용자의 일정, 주소록, 메일에 관한 일을 웹에서 대신 처리하도록 맡긴다. 일정 확인과 등록, 연락처 찾기, 메일 읽기와 보내기에 사용한다. task에는 사용자가 원하는 일을 빠짐없이 한 문장으로 적는다. 결과로 답, 사용자에게 되물을 질문, 실행 전 확인 요청, 또는 아직 진행 중이라는 알림 중 하나가 돌아온다. 진행 중이면 나머지 결과는 나중에 시스템 알림으로 온다.
effect: read
input_schema:
  type: object
  properties:
    task: {type: string, description: "맡길 일. 날짜는 '내일' 대신 2026-11-19처럼 적고, 사람은 이름·직함·부서를 아는 대로 적는다. 예: 2026-11-19 15:00에 영업팀 김민수 부장과 '예산 회의' 30분 일정 등록"}
  required: [task]
output_schema:
  type: object
  properties:
    status: {type: string, enum: [done, asked, confirm, declined, running]}
    task_id: {type: string, description: "status가 confirm일 때 web_task_confirm에 넘길 값"}
    question: {type: string}
timeout_s: 20.0
retries: 0
filler: "네, 확인해 볼게요."
adapter: {kind: http, target: "http://127.0.0.1:7895/task"}
