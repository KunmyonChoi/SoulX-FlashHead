# 의원: 예약 잡기(변경 도구, 확인 필요). 처음 호출하면 확인 문장만 나오고, 환자가 다음 말에서 동의한 뒤
# 같은 인자로 다시 호출해야 예약된다. {name}, {when}, {department}는 더미 의원의 미리보기가 채운다.
name: book_appointment
description: 진료 예약을 잡는다. list_available_slots에서 나온 시각 중 환자가 고른 것으로 호출한다. 처음 호출하면 예약되지 않고 환자에게 읽어 줄 확인 문장이 돌아온다. 환자가 동의하면 같은 인자로 다시 호출한다.
effect: write
input_schema:
  type: object
  properties:
    name: {type: string, description: "환자 이름"}
    birth_date: {type: string, description: "생년월일. 예: 1991-06-20"}
    date: {type: string, description: "예약 날짜. 2026-11-19 형식"}
    time: {type: string, description: "예약 시각. 14:30 형식(24시간)"}
    reason: {type: string, description: "방문 목적을 한 문장으로. 예: 감기 기운"}
  required: [name, birth_date, date, time]
output_schema:
  type: object
  properties:
    appointment_id: {type: string}
    date: {type: string}
    time: {type: string}
    visit_type: {type: string}
confirm_template: "{name} 님, {when} {department} 진료로 예약할까요?"
idempotency_fields: [name, birth_date, date, time]
timeout_s: 4.0
retries: 0
pii_input: [name, birth_date, reason]
pii_output: []
filler: "예약 내용을 확인할게요."
adapter: {kind: python, target: "agentkit.dummy.clinic:book_appointment", options: {preview: "agentkit.dummy.clinic:preview_book_appointment"}}
