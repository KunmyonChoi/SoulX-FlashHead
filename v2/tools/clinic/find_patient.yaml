# 의원: 환자 찾기(조회). 등록되지 않은 환자는 실패가 아니라 "초진"으로 돌아온다.
name: find_patient
description: 이름과 생년월일로 환자를 찾는다. 예약을 잡거나 취소하기 전에 먼저 호출한다. 환자가 두 값을 모두 말한 뒤에 호출한다. 재진인지 초진인지, 이미 잡힌 예약이 있는지 알려 준다.
effect: read
input_schema:
  type: object
  properties:
    name: {type: string, description: "환자 이름. 예: 김하늘"}
    birth_date: {type: string, description: "생년월일. 예: 1991-06-20"}
  required: [name, birth_date]
output_schema:
  type: object
  properties:
    found: {type: boolean}
    visit_type: {type: string, description: "초진 또는 재진"}
    patient_id: {type: string}
    name: {type: string}
    last_visit: {type: string}
timeout_s: 4.0
retries: 1
pii_input: [name, birth_date]
pii_output: [name]
filler: "환자 기록을 확인할게요."
adapter: {kind: python, target: "agentkit.dummy.clinic:find_patient"}
