# v1 조회 도구 (realtime_tools.Toolbox.web_search를 감쌈). 설명과 인자는 v1과 같다.
name: web_search
description: 인터넷 검색으로 웹 페이지를 찾아 제목, 주소, 짧은 설명을 가져온다. 기사나 글에 나온 서비스·회사·제품의 공식 사이트, 원문, 추가 자료, 관련 링크를 찾아 달라거나 '인터넷에서 찾아 줘',
  '검색해 줘'라고 하면 사용한다. 뉴스 기사 제목은 search_news, 백과사전 사실은 search_wikipedia가 더 낫다.
effect: read
input_schema:
  type: object
  properties:
    query:
      type: string
      description: '검색어. 대화의 맥락에서 정한다. 이름은 원어로. 예: Spelunker Internet Archive TV'
  required:
  - query
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 6.0
retries: 1
pii_input: []
pii_output: []
filler: 인터넷에서 찾아볼게요.
adapter:
  kind: python
  target: agentkit.tools.v1_lookup:web_search
