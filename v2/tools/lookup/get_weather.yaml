# v1 조회 도구 (realtime_tools.Toolbox.get_weather을 감쌈). 설명과 인자는 v1과 같다.
name: get_weather
description: 특정 지역의 날씨 예보를 조회한다. 현재 기온이나 오늘 이후 7일까지의 날씨를 물으면 사용한다.
effect: read
input_schema:
  type: object
  properties:
    location:
      type: string
      description: '도시 이름. 예: 서울. 사용자가 지역을 말하지 않았으면 기본 지역.'
    day_offset:
      type: integer
      description: 오늘=0, 내일=1, 모레=2 ... 최대 7
  required:
  - location
  - day_offset
output_schema:
  type: string
  description: 모델에 전할 글
timeout_s: 4.0
retries: 1
pii_input: []
pii_output: []
filler: 날씨 확인해 볼게요.
adapter:
  kind: python
  target: agentkit.tools.v1_lookup:get_weather
