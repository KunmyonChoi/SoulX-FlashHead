# 드라이브스루: 주문서에서 빼기(변경 도구). 확인 단계 없이 바로 빠진다.
name: remove_from_cart
description: 주문서에서 메뉴를 뺀다. 고객이 메뉴를 취소하거나 다른 것으로 바꿀 때 호출한다. quantity를 넣지 않으면 그 메뉴를 모두 뺀다.
effect: write
input_schema:
  type: object
  properties:
    item: {type: string, description: "뺄 메뉴 이름. 예: 치즈버거"}
    quantity: {type: integer, description: "뺄 수량. 넣지 않으면 전부", minimum: 1, maximum: 30}
  required: [item]
output_schema:
  type: object
  properties:
    removed: {type: integer}
    cart: {type: object}
idempotency_fields: []
timeout_s: 4.0
retries: 0
filler: "네, 빼 드릴게요."
adapter: {kind: python, target: "agentkit.dummy.burger:remove_from_cart"}
