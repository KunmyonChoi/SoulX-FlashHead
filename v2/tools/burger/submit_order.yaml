# 드라이브스루: 주문 확정(변경 도구, 확인 필요). 처음 호출하면 주문서와 합계를 읽는 확인 문장만 나오고,
# 고객이 다음 말에서 동의한 뒤 다시 호출해야 확정된다. {summary}는 더미 매장의 미리보기가 채운다.
name: submit_order
description: 지금 주문서대로 주문을 확정한다. 고객이 주문을 다 했다고 할 때 호출한다. 인자는 없다. 처음 호출하면 확정되지 않고 고객에게 읽어 줄 확인 문장(주문 내용과 합계)이 돌아온다. 고객이 맞다고 하면 다시 호출한다.
effect: write
input_schema:
  type: object
  properties: {}
output_schema:
  type: object
  properties:
    order_no: {type: string}
    lines: {type: array}
    total: {type: integer}
    summary: {type: string}
confirm_template: "주문 확인하겠습니다. {summary} 이대로 주문할까요?"
idempotency_fields: []
timeout_s: 4.0
retries: 0
filler: "주문 내용을 확인할게요."
adapter: {kind: python, target: "agentkit.dummy.burger:submit_order", options: {preview: "agentkit.dummy.burger:preview_submit_order"}}
